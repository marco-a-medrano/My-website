<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marco Amedrano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;700;800&display=swap">
<style>
/* ---------- Page basics ---------- */
:root{--ink:#14181b;--sky:#e3e9ec;--mat:#b4bcc0}
*{box-sizing:border-box}
body{margin:0;background:var(--sky);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif}

/* The hero is one full-screen section. Add more sections below it and they scroll normally. */
.hero{position:relative;height:100vh;height:100svh;overflow:hidden;touch-action:none;user-select:none}

/* ---------- 3D scene ---------- */
/* #stage sets the camera: perspective = how strong the 3D effect is,
   perspective-origin = where the horizon sits on the screen. */
#stage{position:absolute;inset:0;perspective:620px;perspective-origin:50% 30%;background:linear-gradient(var(--sky) 0 30%,#c9d1d4)}

/* Fades the far end of the floor into the sky so the world looks endless. */
#fog{position:absolute;inset:0;pointer-events:none;background:linear-gradient(var(--sky) 0 10%,transparent 42%)}

/* The ground plane is tilted back 62deg. It never moves. The car stands on it. */
#ground{position:absolute;left:50%;bottom:0;width:2400px;height:3000px;margin-left:-1200px;
  transform-origin:50% 100%;transform:rotateX(62deg);transform-style:preserve-3d}

/* #clip crops the floor to the ground's size (keeps the huge floor from
   stretching toward the camera). It does not move or rotate. */
#clip{position:absolute;inset:0;overflow:hidden}

/* The floor is a huge square centered under the car (car center = 1200px, 2550px).
   JS rotates it and scrolls its pattern, so the world seems to move while the car stays still.
   The pattern repeats forever: a checker (320px tiles) plus a fine grid (160px lines). */
#floor{position:absolute;left:-1800px;top:-450px;width:6000px;height:6000px;background-color:var(--mat);
  background-image:
    linear-gradient(#14181b30 0 3px,#0000 3px),
    linear-gradient(90deg,#14181b30 0 3px,#0000 3px),
    conic-gradient(#14181b12 25%,#0000 0 50%,#14181b12 0 75%,#0000 0);
  background-size:160px 160px,160px 160px,320px 320px}

/* ---------- The car ---------- */
/* Fixed position on the ground (center at 1200px, 2550px). preserve-3d lets the faces stack into a box. */
#car{position:absolute;left:1155px;top:2495px;width:90px;height:110px;transform-style:preserve-3d}
.b{position:absolute;left:0;top:0;transform-style:preserve-3d}

/* Every face of every box. Colors come from the --c variable of .red / .k. */
.f{position:absolute;left:0;top:0;background:var(--c)}
.d{background:color-mix(in srgb,var(--c),#000 24%)}  /* front and back faces: slightly darker */
.e{background:color-mix(in srgb,var(--c),#000 40%)}  /* side faces: darkest */
.red{--c:#d71920}  /* car body color */
.k{--c:#16191c}    /* camera color */

.shadow{position:absolute;left:-6px;top:-4px;width:102px;height:122px;background:#0006;filter:blur(9px);transform:translateZ(1px)}

/* Camera lens, stuck on the front face of the camera box. */
.lens{position:absolute;left:6px;top:0;width:14px;height:12px;border-radius:50%;border:2px solid #000;
  background:radial-gradient(circle at 35% 35%,#9fe8ff,#0b3a52 65%);
  transform-origin:0 0;transform:rotateX(90deg) translate(0,2px) translateZ(1px)}

/* Spiked wheel: a black disc clipped into a star by --star (built in JS). Grey dot = hub. */
.wh{position:absolute;width:46px;height:46px;background:radial-gradient(#777 0 5px,#0a0a0a 6px);clip-path:var(--star)}

/* ---------- Page text and UI ---------- */
header{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:clamp(16px,3vw,36px)}
h1{margin:0;font-size:clamp(2.4rem,7vw,5.5rem);line-height:.95;font-weight:800;letter-spacing:-.03em}
h1+p{margin:.6rem 0 0;font-size:clamp(1rem,1.6vw,1.25rem);max-width:30ch}
nav{display:flex;gap:1.4rem;padding-top:.6rem}
nav a{color:var(--ink);font-weight:700;text-decoration:none;border-bottom:2px solid var(--ink)}
a:focus-visible,button:focus-visible{outline:3px solid #d71920;outline-offset:3px}

#hint{position:absolute;bottom:clamp(16px,3vw,32px);left:clamp(16px,3vw,36px);max-width:30ch;font-size:.95rem;transition:opacity .6s}
#pause{position:absolute;inset:0;display:none;place-content:center;text-align:center;background:#14181bcc;color:#fff;font-size:clamp(2rem,6vw,4rem);font-weight:800}
#pause.on{display:grid}

/* On-screen buttons, only for touch screens. */
#touch{display:none;position:absolute;left:0;right:0;bottom:24px;justify-content:space-between;padding:0 16px}
#touch div{display:flex;gap:12px}
#touch button{font-size:1.5rem;width:68px;height:68px;border-radius:50%;border:2px solid var(--ink);background:#fffa;color:var(--ink)}
@media (pointer:coarse){#touch{display:flex}#hint{display:none}}
</style>
</head>
<body>
<main class="hero">
  <div id="stage">
    <div id="ground">
      <div id="clip"><div id="floor"></div></div>
      <div id="car"></div>  <!-- filled in by JS below -->
    </div>
  </div>
  <div id="fog"></div>

  <header>
    <div><h1>Marco<br>Amedrano</h1><p>Robotics builder. Take the car for a drive.</p></div>
    <nav><a href="#projects">Projects</a><a href="#about">About</a><a href="#contact">Contact</a></nav>
  </header>

  <div id="hint">Up and down to drive and reverse. Left and right to steer. P pauses.</div>
  <div id="touch">
    <div><button id="bl" aria-label="Steer left">◀</button><button id="br" aria-label="Steer right">▶</button></div>
    <div><button id="bu" aria-label="Drive forward">▲</button><button id="bd" aria-label="Reverse">▼</button></div>
  </div>
  <div id="pause" role="status">Paused</div>
</main>

<script>
const $ = id => document.getElementById(id);
const floor = $('floor'), car = $('car');

/* =========================================================
   1. BUILD THE CAR (red body, front camera, black spiked wheels)
   ========================================================= */

/* box(width, length, height, colorClass) returns the HTML for a 3D box made of 5 flat faces
   (no bottom, it is never seen). translateZ lifts a face up off the ground plane. */
const box = (w,l,h,c) => `
<i class="f ${c}"   style="width:${w}px;height:${l}px;transform:translateZ(${h}px)"></i>                               <!-- top -->
<i class="f ${c} d" style="width:${w}px;height:${h}px;transform-origin:0 0;transform:rotateX(90deg)"></i>              <!-- front -->
<i class="f ${c} d" style="width:${w}px;height:${h}px;top:${l}px;transform-origin:0 0;transform:rotateX(90deg)"></i>   <!-- back -->
<i class="f ${c} e" style="width:${h}px;height:${l}px;transform-origin:0 0;transform:rotateY(-90deg)"></i>             <!-- left -->
<i class="f ${c} e" style="width:${h}px;height:${l}px;left:${w}px;transform-origin:0 0;transform:rotateY(-90deg)"></i> <!-- right -->`;

/* Wheel spikes: a 24-point polygon that alternates between an outer radius (50%) and an
   inner radius (34%), which makes a 12-spike star. Change 34 to make spikes shorter or longer. */
const pts = [];
for (let i = 0; i < 24; i++) {
  const a = i * Math.PI / 12, r = i % 2 ? 34 : 50;
  pts.push(`${50 + r*Math.cos(a)}% ${50 + r*Math.sin(a)}%`);
}
document.documentElement.style.setProperty('--star', `polygon(${pts.join(',')})`);

/* Wheel center positions [x, y] around the body (body is 90 wide, 110 long). */
const spots = [[-6,24],[96,24],[-6,88],[96,88]];

car.innerHTML =
  `<i class="shadow"></i>` +
  /* Body: 90 x 110 x 34, lifted 14px so the wheels carry it */
  `<div class="b" style="transform:translateZ(14px)">${box(90,110,34,'red')}</div>` +
  /* Camera: small box sitting on the front of the roof, lens facing forward */
  `<div class="b" style="left:32px;top:10px;transform:translateZ(48px)">${box(26,22,16,'k')}<i class="lens"></i></div>` +
  /* Four spiked wheels */
  spots.map(([x,y]) => `<i class="wh" style="left:${x-23}px;top:${y-23}px"></i>`).join('');

const wheels = [...car.querySelectorAll('.wh')];

/* =========================================================
   2. DRIVING STATE
   The car never moves on screen. Instead we track where it is in
   the world (px, py) and which way it faces (heading), then move
   and rotate the floor underneath it.
   ========================================================= */
const keys = { l:0, r:0, u:0, d:0 };   // 1 while a control is held
let px = 0, py = 0;                     // car position in the world
let heading = 0;                        // direction in radians (0 = up, positive = turning right)
let speed = 0;                          // positive = forward, negative = reverse
let wheelAng = 0;                       // how far the wheels have spun
let paused = false;
let last = performance.now();

const MAX_SPEED = 14, MAX_REVERSE = 5;  // tweak these for a faster or slower car
const TILE = 320;                       // repeat size of the floor pattern

/* =========================================================
   3. GAME LOOP
   ========================================================= */
function update(dt) {                   // dt = 1 at 60fps, so speed is the same on any screen
  const steer = keys.r - keys.l;        // -1 left, 0 straight, +1 right
  const gas   = keys.u - keys.d;        // +1 forward, -1 brake/reverse

  speed += gas * (gas > 0 ? 0.28 : 0.22) * dt;      // accelerate
  speed *= Math.pow(0.985, dt);                      // friction slows the car when you let go
  speed = Math.max(-MAX_REVERSE, Math.min(MAX_SPEED, speed));

  /* Steering only works while rolling (grip is 0 when stopped, near 1 at speed),
     and flips in reverse like a real car. */
  const grip = speed / (Math.abs(speed) + 3);
  heading += steer * 0.04 * grip * dt;

  /* Move forward along the heading. */
  px += Math.sin(heading) * speed * dt;
  py -= Math.cos(heading) * speed * dt;

  wheelAng += speed * dt * 6;           // wheels spin with speed (backward in reverse)
}

function draw() {
  /* Rotate the whole floor opposite to the heading, so the car always points up the screen. */
  floor.style.transform = `rotate(${-heading * 180 / Math.PI}deg)`;

  /* Scroll the pattern opposite to the car's movement. The modulo keeps numbers small
     and the pattern repeats seamlessly, so the world never ends. */
  const ox = ((-px % TILE) + TILE) % TILE;
  const oy = ((-py % TILE) + TILE) % TILE;
  floor.style.backgroundPosition = `${ox}px ${oy}px`;

  /* Spin the spiked wheels. */
  wheels.forEach(w => w.style.transform = `translateZ(23px) rotateY(90deg) rotate(${wheelAng}deg)`);
}

function loop(t) {
  const dt = Math.min((t - last) / 16.67, 3);   // cap dt so a background tab doesn't cause a jump
  last = t;
  if (!paused) update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* =========================================================
   4. CONTROLS
   ========================================================= */
/* Keyboard: arrows or WASD. */
const map = { ArrowLeft:'l', a:'l', A:'l', ArrowRight:'r', d:'r', D:'r',
              ArrowUp:'u', w:'u', W:'u', ArrowDown:'d', s:'d', S:'d' };

addEventListener('keydown', e => {
  if (map[e.key]) {
    keys[map[e.key]] = 1;
    e.preventDefault();                     // stop arrow keys from scrolling the page
    $('hint').style.opacity = .35;          // fade the hint once you start driving
  }
  if (e.key === 'p' || e.key === 'P') {     // pause toggle
    paused = !paused;
    $('pause').classList.toggle('on', paused);
  }
});
addEventListener('keyup', e => { if (map[e.key]) keys[map[e.key]] = 0; });

/* Touch: hold a button to use it, release to stop. */
[['bl','l'],['br','r'],['bu','u'],['bd','d']].forEach(([id, k]) => {
  const b = $(id);
  b.addEventListener('pointerdown', e => { keys[k] = 1; e.preventDefault(); });
  ['pointerup','pointercancel','pointerleave'].forEach(ev => b.addEventListener(ev, () => keys[k] = 0));
});
</script>
</body>
</html>
