<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Marco Amedrano</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Marco Amedrano's portfolio. Drive the car to explore.">
<style>
:root{--sky1:#f7c873;--sky2:#fbe9c6;--hill1:#d99b5b;--hill2:#b9763f;--grass:#6d8f3a;--dirt:#5a3b22;--ink:#1d1a17;--panel:#fff8ec;--accent:#d42020}
@media (prefers-color-scheme:dark){:root{--sky1:#1b1d3a;--sky2:#5a3d5e;--hill1:#3c2f4a;--hill2:#2b2238;--grass:#3f5a2a;--dirt:#241710;--ink:#f3ead9;--panel:#221d2b}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;font-family:"Trebuchet MS","Gill Sans",system-ui,sans-serif;color:var(--ink);background:var(--sky2)}
canvas{display:block;width:100%;height:100%}
header{position:fixed;top:0;left:0;right:0;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none}
h1{margin:0;font-size:clamp(20px,4vw,34px);letter-spacing:.5px}
header p{margin:2px 0 0;font-size:14px;opacity:.8}
nav{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;pointer-events:auto}
nav button,.ctl button,#panel button{font:inherit;cursor:pointer;border:2px solid var(--ink);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 10px}
nav button:hover,nav button:focus-visible,#panel button:hover,#panel button:focus-visible{background:var(--accent);color:#fff;outline:none}
#hint{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel);border:2px solid var(--ink);border-radius:10px;padding:8px 14px;font-size:15px;white-space:nowrap}
#hint button{margin-left:8px}
.ctl{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:14px;right:14px;display:none;justify-content:space-between;pointer-events:none}
.ctl button{pointer-events:auto;width:80px;height:60px;font-size:26px;touch-action:none;user-select:none}
@media (pointer:coarse){.ctl{display:flex}}
#panel{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.35)}
#panel.open{display:flex}
#card{background:var(--panel);border:3px solid var(--ink);border-radius:14px;max-width:520px;width:100%;max-height:80%;overflow:auto;padding:22px}
#card h2{margin:0 0 10px;font-size:26px}
#card p,#card li{line-height:1.5;max-width:60ch}
#card a{color:var(--accent);font-weight:bold}
</style>
</head>
<body>
<canvas id="c" aria-label="Driving game portfolio"></canvas>
<header>
  <div><h1>Marco Amedrano</h1><p>Drive with arrow keys or A / D. Stop at a sign to open it.</p></div>
  <nav id="nav" aria-label="Jump to section"></nav>
</header>
<div id="hint" hidden></div>
<div class="ctl"><button id="bl" aria-label="Drive left">◀</button><button id="br" aria-label="Drive right">▶</button></div>
<div id="panel" role="dialog" aria-modal="true"><div id="card"></div></div>

<script>
/* ===== EDIT YOUR CONTENT HERE ===== */
const STATIONS=[
 {x:500, label:"About", html:"<h2>About</h2><p>Hi, I'm Marco Amedrano. Write a short intro here: who you are, what you do, and what you're looking for.</p>"},
 {x:1300,label:"Projects", html:"<h2>Projects</h2><ul><li><b>Project one</b>: one line on what it is and your role.</li><li><b>Project two</b>: one line on what it is and your role.</li><li><b>Project three</b>: one line on what it is and your role.</li></ul>"},
 {x:2100,label:"Skills", html:"<h2>Skills</h2><ul><li>Skill or tool</li><li>Skill or tool</li><li>Skill or tool</li></ul>"},
 {x:2900,label:"Contact", html:"<h2>Contact</h2><p>Email: <a href='mailto:you@marcoamedrano.com'>you@marcoamedrano.com</a></p><p><a href='#'>LinkedIn</a> · <a href='#'>GitHub</a></p>"}
];
/* ================================== */
const WORLD=3400, cv=document.getElementById('c'), g=cv.getContext('2d');
const $=id=>document.getElementById(id);
let W,H,dpr;
function resize(){dpr=window.devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
const terrain=x=>{
  return H*0.68+38*Math.sin(x/260)+22*Math.sin(x/97+1)-(flat(x))};
function flat(x){ // flatten hills near signs so parking is easy
  let d=1e9;for(const s of STATIONS)d=Math.min(d,Math.abs(x-s.x));
  const k=Math.max(0,1-d/160);return k*(38*Math.sin(x/260)+22*Math.sin(x/97+1))*0.9}
const car={x:120,v:0,rot:0,ang:0};
const keys={};let open=false,near=null;
addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','a','d','A','D'].includes(e.key))e.preventDefault();
  keys[e.key.toLowerCase()]=true;
  if((e.key==='Enter'||e.key==='e'||e.key==='E'||e.key===' ')&&near&&!open){e.preventDefault();openPanel(near)}
  if(e.key==='Escape')closePanel();
});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
for(const [id,k] of [['bl','arrowleft'],['br','arrowright']]){
  const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});
  ['pointerup','pointerleave','pointercancel'].forEach(t=>b.addEventListener(t,()=>keys[k]=false));
}
function openPanel(s){open=true;$('card').innerHTML=s.html+'<p><button id="x">Back to the road</button></p>';$('panel').classList.add('open');$('x').onclick=closePanel;$('x').focus()}
function closePanel(){open=false;$('panel').classList.remove('open')}
$('panel').addEventListener('click',e=>{if(e.target.id==='panel')closePanel()});
const nav=$('nav');
STATIONS.forEach(s=>{const b=document.createElement('button');b.textContent=s.label;b.onclick=()=>{car.x=s.x-90;car.v=0;closePanel()};nav.appendChild(b)});

const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function wheel(cx,cy,r,rot){
  g.fillStyle='#000';
  for(let i=0;i<8;i++){const a=rot+i*Math.PI/4;
    g.beginPath();g.moveTo(cx+Math.cos(a-.22)*r,cy+Math.sin(a-.22)*r);
    g.lineTo(cx+Math.cos(a)*(r+8),cy+Math.sin(a)*(r+8));
    g.lineTo(cx+Math.cos(a+.22)*r,cy+Math.sin(a+.22)*r);g.fill()}
  g.beginPath();g.arc(cx,cy,r,0,7);g.fill();
  g.fillStyle='#777';g.beginPath();g.arc(cx,cy,3.5,0,7);g.fill();
}
let last=performance.now();
function frame(t){
  const dt=Math.min(.033,(t-last)/1000);last=t;
  const dir=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0);
  if(!open){
    const slope=(terrain(car.x+10)-terrain(car.x-10))/20;
    car.v+=dir*420*dt-slope*260*dt;
    car.v*=dir?0.992:0.96;
    car.x=Math.max(60,Math.min(WORLD-60,car.x+car.v*dt));
    if(car.x<=60||car.x>=WORLD-60)car.v=0;
    car.rot+=car.v*dt/14;
  }
  const cam=Math.max(0,Math.min(WORLD-W,car.x-W/2));
  // sky
  const sk=g.createLinearGradient(0,0,0,H);sk.addColorStop(0,css('--sky1'));sk.addColorStop(1,css('--sky2'));
  g.fillStyle=sk;g.fillRect(0,0,W,H);
  // parallax hills
  for(const [p,col,base,amp] of [[.2,'--hill1',.5,50],[.5,'--hill2',.6,40]]){
    g.fillStyle=css(col);g.beginPath();g.moveTo(0,H);
    for(let x=0;x<=W;x+=12){const wx=x+cam*p;g.lineTo(x,H*base+amp*Math.sin(wx/200)+amp*.5*Math.sin(wx/77))}
    g.lineTo(W,H);g.fill();
  }
  // ground
  g.beginPath();g.moveTo(0,H);
  for(let x=0;x<=W+8;x+=8)g.lineTo(x,terrain(x+cam));
  g.lineTo(W,H);g.closePath();g.fillStyle=css('--dirt');g.fill();
  g.strokeStyle=css('--grass');g.lineWidth=8;g.lineJoin='round';g.beginPath();
  for(let x=0;x<=W+8;x+=8){const y=terrain(x+cam);x?g.lineTo(x,y):g.moveTo(x,y)}g.stroke();
  // signs
  near=null;g.font='bold 18px "Trebuchet MS",sans-serif';g.textAlign='center';
  for(const s of STATIONS){
    const sx=s.x-cam,sy=terrain(s.x);
    if(sx<-150||sx>W+150)continue;
    const isNear=Math.abs(car.x-s.x)<70;if(isNear)near=s;
    g.fillStyle='#6b4a2b';g.fillRect(sx-4,sy-90,8,90);
    const w=g.measureText(s.label).width+28;
    g.fillStyle=isNear?'#d42020':'#fff8ec';g.strokeStyle='#1d1a17';g.lineWidth=3;
    g.beginPath();g.roundRect(sx-w/2,sy-140,w,46,8);g.fill();g.stroke();
    g.fillStyle=isNear?'#fff':'#1d1a17';g.fillText(s.label,sx,sy-110);
  }
  // car
  const R=13,hw=20,ax=car.x-hw,bx=car.x+hw;
  const ay=terrain(ax)-R,by=terrain(bx)-R;
  const ang=Math.atan2(by-ay,bx-ax);car.ang+=(ang-car.ang)*.3;
  const cx=car.x-cam,cy=(ay+by)/2;
  g.save();g.translate(cx,cy);g.rotate(car.ang);
  g.fillStyle='#d42020';g.strokeStyle='#7a0f0f';g.lineWidth=3;
  g.fillRect(-26,-58,52,52);g.strokeRect(-26,-58,52,52);
  g.fillStyle='#ffd9d9';g.fillRect(2,-50,18,16); // window
  g.fillStyle='#ffe98a';g.fillRect(22,-24,6,8);   // headlight
  wheel(-hw,0,R,car.rot);wheel(hw,0,R,car.rot);
  g.restore();
  // hint
  const h=$('hint');
  if(near&&!open){if(h.dataset.k!==near.label){h.dataset.k=near.label;h.innerHTML='Open '+near.label+' <button id="go">Enter</button>';$('go').onclick=()=>openPanel(near)}h.hidden=false}
  else{h.hidden=true;h.dataset.k=''}
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
